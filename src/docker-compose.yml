x-airflow-common: &airflow-common
  build: .
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    PYTHONPATH: "/opt/airflow/"
    AIRFLOW__CORE__PARALLELISM: 4
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 2
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql8:3306/${MYSQL_DATABASE}
    AIRFLOW__CORE__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__API__SERVER_HOST: 0.0.0.0
    AIRFLOW__CORE__INTERNAL_API_URL: http://airflow-api-server:8080/execution
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution
    
    CLOUDSQL_URL: "mysql+pymysql://root:123456@host.docker.internal:3307/test_db"
    REDIS_HOST: "host.docker.internal"
    REDIS_PORT: "6380"
    
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
  depends_on:
    mysql8:
      condition: service_healthy
  restart: always

services:
  mysql8:
    image: mysql:8.0.36
    env_file:
    - .env
    container_name: mysql8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 2gb
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10


  # 一次性初始化：建表 + 建 admin
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    restart: "no"
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create \
        --username ${AIRFLOW_ADMIN_USER} \
        --password ${AIRFLOW_ADMIN_PASSWORD} \
        --firstname Air \
        --lastname Flow \
        --role Admin \
        --email ${AIRFLOW_ADMIN_EMAIL} || true
      "

  airflow-api-server:
    <<: *airflow-common
    container_name: airflow_api_server
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "18080:8080"
    command: api-server

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow_dag_processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow_triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: triggerer


volumes:
  mysql_data:
  redis_data: